name: Checks
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ownday_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: ownday_test_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ownday_test -d ownday_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ownday_test:local-ci-only@127.0.0.1:5432/ownday_test_ci
      TEST_DATABASE_URL: postgresql://ownday_test:local-ci-only@127.0.0.1:5432/ownday_test_ci
      SESSION_SECRET: isolated-ci-session-secret-never-used-in-production
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ownday/db exec prisma migrate deploy
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm db:verify-backup --with-fixture

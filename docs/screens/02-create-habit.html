<!DOCTYPE html>

<style>
        body { background-color: #F3F6F1; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1; }
        
        /* Custom scrollbar for horizontal lists */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Interactive scaling */
        .interactive-scale:active { transform: scale(0.98); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="font-body-md text-on-surface antialiased w-full max-w-max-width mx-auto min-h-screen pb-[120px]">
<!-- Header (Shared Component: TopAppBar conceptually) -->
<header class="flex items-center justify-between px-margin-page h-huge sticky top-0 bg-[#F3F6F1] z-50">
<button aria-label="Close" class="w-huge h-huge flex items-center justify-start text-ink hover:opacity-80 active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-ink absolute left-1/2 transform -translate-x-1/2">New habit</h1>
<div class="w-huge"></div> <!-- Spacer for centering -->
</header>
<main class="px-margin-page py-lg space-y-xl">
<!-- Section 1: Habit Name -->
<section class="space-y-sm">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-[0.14em]">Habit Name</label>
<input class="w-full h-[56px] px-lg rounded-[10px] bg-surface-bright border-none shadow-system text-body-md font-body-md text-ink placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:outline-none" placeholder="e.g. Morning run" type="text"/>
</section>
<!-- Section 2: Icon & Color -->
<section class="bg-surface-bright rounded-[10px] shadow-system overflow-hidden">
<div class="p-lg border-b border-outline-variant">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-[0.14em] block mb-md">Icon</label>
<div class="flex overflow-x-auto hide-scrollbar space-x-md -mx-lg px-lg pb-sm">
<!-- Selected Icon -->
<button class="flex-shrink-0 w-[48px] h-[48px] rounded-[6px] bg-surface-dim flex items-center justify-center text-ink border-2 border-primary interactive-scale">
<span class="material-symbols-outlined filled" data-icon="water_drop">water_drop</span>
</button>
<!-- Unselected Icons -->
<button class="flex-shrink-0 w-[48px] h-[48px] rounded-[6px] bg-surface-dim flex items-center justify-center text-outline hover:text-ink interactive-scale transition-colors">
<span class="material-symbols-outlined" data-icon="directions_run">directions_run</span>
</button>
<button class="flex-shrink-0 w-[48px] h-[48px] rounded-[6px] bg-surface-dim flex items-center justify-center text-outline hover:text-ink interactive-scale transition-colors">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
</button>
<button class="flex-shrink-0 w-[48px] h-[48px] rounded-[6px] bg-surface-dim flex items-center justify-center text-outline hover:text-ink interactive-scale transition-colors">
<span class="material-symbols-outlined" data-icon="self_improvement">self_improvement</span>
</button>
<button class="flex-shrink-0 w-[48px] h-[48px] rounded-[6px] bg-surface-dim flex items-center justify-center text-outline hover:text-ink interactive-scale transition-colors">
<span class="material-symbols-outlined" data-icon="fitness_center">fitness_center</span>
</button>
<button class="flex-shrink-0 w-[48px] h-[48px] rounded-[6px] bg-surface-dim flex items-center justify-center text-outline hover:text-ink interactive-scale transition-colors">
<span class="material-symbols-outlined" data-icon="local_cafe">local_cafe</span>
</button>
<button class="flex-shrink-0 w-[48px] h-[48px] rounded-[6px] bg-surface-dim flex items-center justify-center text-outline hover:text-ink interactive-scale transition-colors">
<span class="material-symbols-outlined" data-icon="nightlight">nightlight</span>
</button>
<button class="flex-shrink-0 w-[48px] h-[48px] rounded-[6px] bg-surface-dim flex items-center justify-center text-outline hover:text-ink interactive-scale transition-colors">
<span class="material-symbols-outlined" data-icon="savings">savings</span>
</button>
</div>
</div>
<div class="p-lg">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-[0.14em] block mb-md">Color</label>
<div class="flex space-x-lg">
<!-- Selected Color -->
<button class="w-[32px] h-[32px] rounded-full flex items-center justify-center border-2 border-primary interactive-scale p-1">
<div class="w-full h-full rounded-full bg-[#1B8A62]"></div>
</button>
<!-- Unselected Colors -->
<button class="w-[32px] h-[32px] rounded-full flex items-center justify-center border-2 border-transparent hover:border-outline-variant interactive-scale p-1 transition-colors">
<div class="w-full h-full rounded-full bg-error"></div>
</button>
<button class="w-[32px] h-[32px] rounded-full flex items-center justify-center border-2 border-transparent hover:border-outline-variant interactive-scale p-1 transition-colors">
<div class="w-full h-full rounded-full bg-streak-dark"></div>
</button>
<button class="w-[32px] h-[32px] rounded-full flex items-center justify-center border-2 border-transparent hover:border-outline-variant interactive-scale p-1 transition-colors">
<div class="w-full h-full rounded-full bg-[#4A90E2]"></div>
</button>
<button class="w-[32px] h-[32px] rounded-full flex items-center justify-center border-2 border-transparent hover:border-outline-variant interactive-scale p-1 transition-colors">
<div class="w-full h-full rounded-full bg-[#9B51E0]"></div>
</button>
<button class="w-[32px] h-[32px] rounded-full flex items-center justify-center border-2 border-transparent hover:border-outline-variant interactive-scale p-1 transition-colors">
<div class="w-full h-full rounded-full bg-[#333333]"></div>
</button>
</div>
</div>
</section>
<!-- Section 3: Habit Type -->
<section class="bg-surface-bright rounded-[10px] shadow-system overflow-hidden">
<div class="p-lg border-b border-outline-variant">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-[0.14em] block mb-md">Habit Type</label>
<!-- Segmented Control -->
<div class="flex bg-surface-dim rounded-[8px] p-1 w-full relative">
<!-- Active Indicator (Background) - conceptually positioned -->
<div class="absolute inset-y-1 left-1/3 w-[32.33%] bg-surface-bright rounded-[6px] shadow-sm z-0"></div>
<button class="flex-1 py-2 font-body-sm text-body-sm text-outline z-10 text-center relative interactive-scale">Checkbox</button>
<button class="flex-1 py-2 font-body-sm text-body-sm text-ink font-medium z-10 text-center relative interactive-scale">Counter</button>
<button class="flex-1 py-2 font-body-sm text-body-sm text-outline z-10 text-center relative interactive-scale">Duration</button>
</div>
</div>
<!-- Expanded Counter Fields -->
<div class="p-lg flex space-x-md">
<div class="w-1/3">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-[0.14em] block mb-sm">Target</label>
<input class="w-full h-[48px] rounded-[8px] bg-surface-dim border-none text-center font-counter-lg text-counter-lg text-ink focus:ring-2 focus:ring-primary focus:outline-none" type="number" value="8"/>
</div>
<div class="flex-1">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-[0.14em] block mb-sm">Unit</label>
<input class="w-full h-[48px] px-md rounded-[8px] bg-surface-dim border-none font-body-md text-body-md text-ink focus:ring-2 focus:ring-primary focus:outline-none" type="text" value="glasses"/>
</div>
</div>
</section>
<!-- Section 4: Schedule -->
<section class="bg-surface-bright rounded-[10px] shadow-system overflow-hidden">
<div class="p-lg">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-[0.14em] block mb-md">Schedule</label>
<div class="space-y-md">
<!-- Radio Options -->
<label class="flex items-center space-x-md cursor-pointer group">
<div class="w-5 h-5 rounded-full border-2 border-outline group-hover:border-ink flex items-center justify-center"></div>
<span class="font-body-md text-body-md text-outline group-hover:text-ink">Every day</span>
</label>
<label class="flex items-center space-x-md cursor-pointer">
<div class="w-5 h-5 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-2.5 h-2.5 bg-primary rounded-full"></div>
</div>
<span class="font-body-md text-body-md text-ink font-medium">Certain days of the week</span>
</label>
<!-- Expanded Days Selection -->
<div class="pl-xl pt-sm pb-sm">
<div class="flex justify-between w-full max-w-[280px]">
<button class="w-[32px] h-[32px] rounded-full bg-[#1B8A62] text-white font-label-caps text-label-caps flex items-center justify-center interactive-scale">M</button>
<button class="w-[32px] h-[32px] rounded-full bg-surface-dim text-outline hover:text-ink font-label-caps text-label-caps flex items-center justify-center interactive-scale transition-colors">T</button>
<button class="w-[32px] h-[32px] rounded-full bg-[#1B8A62] text-white font-label-caps text-label-caps flex items-center justify-center interactive-scale">W</button>
<button class="w-[32px] h-[32px] rounded-full bg-surface-dim text-outline hover:text-ink font-label-caps text-label-caps flex items-center justify-center interactive-scale transition-colors">T</button>
<button class="w-[32px] h-[32px] rounded-full bg-[#1B8A62] text-white font-label-caps text-label-caps flex items-center justify-center interactive-scale">F</button>
<button class="w-[32px] h-[32px] rounded-full bg-surface-dim text-outline hover:text-ink font-label-caps text-label-caps flex items-center justify-center interactive-scale transition-colors">S</button>
<button class="w-[32px] h-[32px] rounded-full bg-surface-dim text-outline hover:text-ink font-label-caps text-label-caps flex items-center justify-center interactive-scale transition-colors">S</button>
</div>
</div>
<label class="flex items-center space-x-md cursor-pointer group">
<div class="w-5 h-5 rounded-full border-2 border-outline group-hover:border-ink flex items-center justify-center"></div>
<span class="font-body-md text-body-md text-outline group-hover:text-ink">N times per week</span>
</label>
<label class="flex items-center space-x-md cursor-pointer group">
<div class="w-5 h-5 rounded-full border-2 border-outline group-hover:border-ink flex items-center justify-center"></div>
<span class="font-body-md text-body-md text-outline group-hover:text-ink">Every N days</span>
</label>
</div>
</div>
</section>
<!-- Section 5: Reminder -->
<section class="bg-surface-bright rounded-[10px] shadow-system overflow-hidden">
<div class="p-lg flex items-center justify-between border-b border-outline-variant">
<span class="font-title-sm text-title-sm text-ink">Remind me</span>
<!-- Toggle Switch Enabled -->
<button aria-checked="true" class="w-[44px] h-[24px] bg-[#1B8A62] rounded-full relative transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary interactive-scale" role="switch">
<span class="absolute left-[22px] top-[2px] w-[20px] h-[20px] bg-white rounded-full shadow-sm transition-transform"></span>
</button>
</div>
<div class="p-lg flex items-center justify-between bg-surface-container-low">
<div class="flex items-center space-x-md">
<span class="material-symbols-outlined text-outline" data-icon="schedule">schedule</span>
<span class="font-counter-lg text-counter-lg text-ink">07:00</span>
</div>
<div class="relative">
<select class="appearance-none bg-surface-dim border-none rounded-[6px] py-1 pl-md pr-[32px] font-body-sm text-body-sm text-ink focus:ring-2 focus:ring-primary focus:outline-none cursor-pointer">
<option>Telegram</option>
<option>Push notification</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 transform -translate-y-1/2 text-outline pointer-events-none text-[16px]" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</section>
</main>
<!-- Footer: Create Button -->
<footer class="fixed bottom-0 left-0 w-full bg-[#F3F6F1] px-margin-page pb-huge pt-lg z-50">
<div class="max-w-max-width mx-auto">
<button class="w-full h-[56px] bg-ink rounded-[10px] text-white font-title-sm text-title-sm flex items-center justify-center interactive-scale shadow-system hover:opacity-90 transition-opacity">
                Create habit
            </button>
</div>
</footer>
</body></html>
